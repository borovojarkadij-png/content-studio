name: Quality gate

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests alembic ../scripts/ui_fixture_api.py ../scripts/docker_persistence_probe.py ../scripts/docker_rewrite_recovery_probe.py ../scripts/docker_source_guard_probe.py ../scripts/docker_semantic_probe.py ../scripts/docker_media_probe.py ../scripts/docker_ingestion_probe.py ../scripts/docker_telegram_health_probe.py ../scripts/docker_telegram_peer_probe.py ../scripts/docker_mapping_filter_probe.py ../scripts/docker_donor_resolution_probe.py ../scripts/docker_source_photo_probe.py ../scripts/docker_publication_probe.py ../scripts/docker_channel_sync_probe.py ../scripts/docker_rewrite_sync_wait_probe.py ../scripts/docker_admission_probe.py
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate migrations
        env:
          DATABASE_URL: sqlite:///migration-ci-isolated.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated API fixture dependencies
        run: python -m pip install -e ../backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser regressions and eight-section screenshots
        run: npm run test:e2e
      - name: Upload UI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-dark-navy
          path: .artifacts/ui-dark-navy
          include-hidden-files: true
          retention-days: 14

  docker-persistence:
    name: Synthetic Docker persistence (${{ matrix.provider }})
    runs-on: ubuntu-latest
    # Four recovery families include deliberate lease waits and real down/up.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        provider: [OPENAI, OPENROUTER]
    steps:
      - uses: actions/checkout@v4
      - name: Build, migrate and verify isolated restart/crash recovery
        shell: pwsh
        run: ./scripts/verify-persistence.ps1 -Project newsflow-verification-ci -CrashRecovery -RewriteRecovery -SourceGuard -SemanticGuard -MediaGuard -IngestionGuard -PeerGuard -MappingGuard -ResolutionGuard -SourcePhotoGuard -PublicationGuard -RewriteProvider ${{ matrix.provider }}

  channel-sync-persistence:
    name: Synthetic channel sync PostgreSQL restart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify separate create-only synchronization fixture
        shell: pwsh
        run: ./scripts/verify-persistence.ps1 -Project newsflow-verification-channel-sync-ci -CrashRecovery -ChannelSyncGuard

  admission-persistence:
    name: Synthetic guarded admission PostgreSQL restart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify separate create-only admission fixture
        shell: pwsh
        run: ./scripts/verify-persistence.ps1 -Project newsflow-verification-admission-ci -CrashRecovery -AdmissionGuard

  unattended-postgres:
    name: Synthetic unattended PostgreSQL vertical slice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: newsflow_unattended_ci
          POSTGRES_USER: newsflow_fixture
          POSTGRES_PASSWORD: synthetic-unattended-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsflow_fixture -d newsflow_unattended_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated backend test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Migrated PostgreSQL vertical slice with original SQL reopen at every stage
        env:
          NEWSFLOW_UNATTENDED_POSTGRES_URL: postgresql+psycopg://newsflow_fixture:synthetic-unattended-ci-only@127.0.0.1:5432/newsflow_unattended_ci
        run: python -m pytest tests/test_unattended_vertical_slice.py tests/test_unattended_postgres_target.py -q
