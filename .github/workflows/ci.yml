name: Quality gate

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests alembic ../scripts/ui_fixture_api.py ../scripts/docker_persistence_probe.py ../scripts/docker_rewrite_recovery_probe.py ../scripts/docker_source_guard_probe.py ../scripts/docker_semantic_probe.py ../scripts/docker_media_probe.py ../scripts/docker_ingestion_probe.py ../scripts/docker_telegram_health_probe.py ../scripts/docker_telegram_peer_probe.py ../scripts/docker_mapping_filter_probe.py ../scripts/docker_donor_resolution_probe.py ../scripts/docker_source_photo_probe.py ../scripts/docker_publication_probe.py
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate migrations
        env:
          DATABASE_URL: sqlite:///migration-ci-isolated.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated API fixture dependencies
        run: python -m pip install -e ../backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser regressions and eight-section screenshots
        run: npm run test:e2e
      - name: Upload UI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-dark-navy
          path: .artifacts/ui-dark-navy
          include-hidden-files: true
          retention-days: 14

  docker-persistence:
    name: Synthetic Docker persistence (${{ matrix.provider }})
    runs-on: ubuntu-latest
    # Four recovery families include deliberate lease waits and real down/up.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        provider: [OPENAI, OPENROUTER]
    steps:
      - uses: actions/checkout@v4
      - name: Build, migrate and verify isolated restart/crash recovery
        shell: pwsh
        run: ./scripts/verify-persistence.ps1 -Project newsflow-verification-ci -CrashRecovery -RewriteRecovery -SourceGuard -SemanticGuard -MediaGuard -IngestionGuard -PeerGuard -MappingGuard -ResolutionGuard -SourcePhotoGuard -PublicationGuard -RewriteProvider ${{ matrix.provider }}
