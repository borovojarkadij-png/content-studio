name: newsflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newsflow}
      POSTGRES_USER: ${POSTGRES_USER:-newsflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrations:
    build: ./backend
    command: python -m newsflow.migrate
    env_file: ${NEWSFLOW_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    env_file: ${NEWSFLOW_ENV_FILE:-.env}
    environment:
      NEWSFLOW_MASTER_KEY_FILE: /run/secrets/newsflow_master_key
      NEWSFLOW_MEDIA_ROOT: /var/lib/newsflow/media
    volumes:
      - media_data:/var/lib/newsflow/media:ro
    secrets:
      - newsflow_master_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    ports: ["127.0.0.1:${NEWSFLOW_API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app
    environment:
      NEWSFLOW_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports: ["127.0.0.1:${NEWSFLOW_WEB_PORT:-5173}:5173"]
    depends_on:
      api:
        condition: service_healthy

  web-production:
    profiles: ["production"]
    build: ./frontend
    ports: ["${NEWSFLOW_BIND_HOST:-127.0.0.1}:${NEWSFLOW_PROD_WEB_PORT:-8080}:80"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    profiles: ["dev", "production"]
    build: ./backend
    command: python -m newsflow.worker
    env_file: ${NEWSFLOW_ENV_FILE:-.env}
    environment:
      NEWSFLOW_MASTER_KEY_FILE: /run/secrets/newsflow_master_key
      NEWSFLOW_MEDIA_ROOT: /var/lib/newsflow/media
    secrets:
      - newsflow_master_key
    volumes:
      - media_data:/var/lib/newsflow/media
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  media_data:

secrets:
  newsflow_master_key:
    file: ${NEWSFLOW_MASTER_KEY_SOURCE:-./secrets/newsflow_master_key}
